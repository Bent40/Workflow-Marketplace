# core/constitution/security.yaml — checkable security constraints (Epic C / C2).
#
# Constitution constraints are GATES (checkable), distinct from core/rules
# (guidance). Each carries an `activation` (only `default` exists — the
# `secure_only` level was removed with the secure posture, core/DECISIONS.md D6).
constraints:
  - id: SEC-1
    statement: Untrusted input is validated/normalized at the trust boundary before use.
    activation: default
    check: "Point to where boundary validation/normalization happens."
    severity: high
  - id: SEC-2
    statement: Secrets live in config/environment, never hardcoded in source or committed.
    activation: default
    check: "Show secrets sourced from config/env, not literals."
    severity: high
