# Policy overlay — epics/stories breakdown skills, SIZE-AWARE right-sizing.
# Owned layer (core/policy/): imposes obligations on the vendored story-breakdown
# skills WITHOUT editing them or shattering them into sub-skills. Surfaced by
# `wf policy show <skill>`; the agent honors it before invoking the skill.
# Schema: core/policy/policy-schema.md.
#
# WHY: bmad-create-epics-and-stories / bmad-create-story / gds-* can impose full
# epic ceremony (epic decomposition + packetization + dependency graphs) onto a
# handful of stories, burning tokens on structure that does not reduce risk. This
# overlay tells the agent to RIGHT-SIZE the breakdown to the work size — scaling
# by STORY COUNT per orchestration.subagent_trigger_thresholds (>10 stories ->
# split into packets) — WITHOUT under-structuring a platform. Mirrors the voice
# of code-review-right-sizing.yaml / prd-right-sizing.yaml.
id: stories-right-sizing
title: "Stories right-sizing (size-tier the breakdown; scale by story count)"

applies_to:
  # fnmatch globs over skill names under .claude/skills/. Each must match >=1 real
  # skill (wf policy check fails closed otherwise). Targets the epic/story
  # breakdown surfaces across BMM and Game Dev Studio.
  skill_globs:
    - "bmad-create-epics-and-stories"   # BMM epic + story breakdown
    - "bmad-create-story"               # BMM single dev-ready story
    - "gds-create-epics-and-stories"    # Game Dev Studio epic + story breakdown
    - "gds-create-story"                # Game Dev Studio single story
  categories:
    - stories
    - planning

requirements:
  - "RIGHT-SIZE the breakdown to the work size before producing it, per gating.right_size_process_to_project. Classify the work up front and cap the structure to that tier — process volume is a cost, not a virtue. State the chosen tier and WHY at the top of the breakdown output."
  - "TINY tier (a toy / a handful of stories): produce a SHORT FLAT story list only — no epic ceremony, no packetization, no dependency-graph scaffolding. Do NOT impose epic decomposition on a handful of stories — that is the disproportionate ceremony right-sizing exists to prevent."
  - "Scale by STORY COUNT per orchestration.subagent_trigger_thresholds, NOT by default ceremony: when the breakdown exceeds ~10 stories, split it into PACKETS (grouped, independently dev-able units). Below that threshold, a flat list (or a light grouping) is right-sized."
  - "MEDIUM and LARGE tiers: produce the FULL epic -> story decomposition with acceptance criteria and explicit inter-story dependencies, packetized where the >10-story threshold applies. No structure is dropped at these tiers. Never under-structure a platform."
  - "Honesty: state the chosen tier and its justification explicitly. Never impose epic ceremony on a handful of stories, and never under-structure a platform. When a lite tier is chosen, say which structure (epics, packets, dependency graph) was intentionally OMITTED."

enforcement: instructions
