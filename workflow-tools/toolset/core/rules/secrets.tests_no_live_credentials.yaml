id: secrets.tests_no_live_credentials
scope: universal
severity: high
activation: default
applies_to:
  - claude
  - codex
  - gemini
  - copilot
  - local
summary: Tests must not require real credentials or live production systems.
short_form: Tests run on fixtures/fakes — never real credentials or production.
full_text: |
  Unit and integration tests must not depend on real credentials, secrets, or
  live production systems. Use fixtures, fakes, mocks, or local services so the
  suite runs anywhere without privileged access.
